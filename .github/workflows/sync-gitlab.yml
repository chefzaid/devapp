name: Sync GitHub and GitLab

on:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-gitlab-main-sync
  cancel-in-progress: false

jobs:
  sync-main:
    name: Reconcile main
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITLAB_REPOSITORY: https://gitlab.swirlit.dev/root/devapp.git
      GITLAB_USERNAME: ${{ secrets.GITLAB_SYNC_USERNAME }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_SYNC_TOKEN }}
    steps:
      - name: Reconcile GitHub and GitLab main
        shell: bash
        run: |
          set -euo pipefail

          [[ -n "${GITLAB_USERNAME:-}" ]] || {
            echo "GITLAB_SYNC_USERNAME is not configured" >&2
            exit 1
          }
          [[ -n "${GITLAB_TOKEN:-}" ]] || {
            echo "GITLAB_SYNC_TOKEN is not configured" >&2
            exit 1
          }

          askpass="$RUNNER_TEMP/git-askpass"
          cat > "$askpass" <<'EOF'
          #!/bin/sh
          case "$1" in
            *github.com*Username*) printf '%s\n' 'x-access-token' ;;
            *github.com*) printf '%s\n' "$GITHUB_TOKEN" ;;
            *gitlab.swirlit.dev*Username*) printf '%s\n' "$GITLAB_USERNAME" ;;
            *gitlab.swirlit.dev*) printf '%s\n' "$GITLAB_TOKEN" ;;
            *) exit 1 ;;
          esac
          EOF
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass"
          export GIT_TERMINAL_PROMPT=0

          repository="$RUNNER_TEMP/devapp-sync"
          git init --quiet "$repository"
          cd "$repository"
          git config user.name 'DevApp repository sync'
          git config user.email 'repository-sync@swirlit.dev'
          git remote add github "https://github.com/${GITHUB_REPOSITORY}.git"
          git remote add gitlab "$GITLAB_REPOSITORY"
          git fetch --quiet --no-tags github \
            +refs/heads/main:refs/remotes/github/main
          git fetch --quiet --no-tags gitlab \
            +refs/heads/main:refs/remotes/gitlab/main

          github_head=$(git rev-parse refs/remotes/github/main)
          gitlab_head=$(git rev-parse refs/remotes/gitlab/main)

          if [[ "$github_head" == "$gitlab_head" ]]; then
            echo "GitHub and GitLab main already match at $github_head"
          elif git merge-base --is-ancestor "$gitlab_head" "$github_head"; then
            echo "Fast-forwarding GitLab main to GitHub $github_head"
            git push gitlab "$github_head:refs/heads/main"
          elif git merge-base --is-ancestor "$github_head" "$gitlab_head"; then
            echo "Fast-forwarding GitHub main to GitLab $gitlab_head"
            git push github "$gitlab_head:refs/heads/main"
          else
            echo "The mirrors diverged; merging GitLab main into GitHub main"
            git checkout --quiet --detach "$github_head"
            git merge --no-ff -m 'sync: merge GitLab main into GitHub' "$gitlab_head"
            merged_head=$(git rev-parse HEAD)
            git push gitlab "$merged_head:refs/heads/main"
            git push github "$merged_head:refs/heads/main"
          fi

          git fetch --quiet --no-tags github \
            +refs/heads/main:refs/remotes/github/main
          git fetch --quiet --no-tags gitlab \
            +refs/heads/main:refs/remotes/gitlab/main
          github_head=$(git rev-parse refs/remotes/github/main)
          gitlab_head=$(git rev-parse refs/remotes/gitlab/main)
          [[ "$github_head" == "$gitlab_head" ]] || {
            echo "GitHub and GitLab main differ after reconciliation" >&2
            exit 1
          }
          echo "GitHub and GitLab main match at $github_head"
