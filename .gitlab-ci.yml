workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

stages:
  - validate
  - test
  - publish
  - deploy
  - verify
  - acceptance

default:
  tags:
    - bm-cluster
  interruptible: true

variables:
  APP_VERSION: "$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.cache/maven"
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.cache/npm"

validate:manifests:
  stage: validate
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache kubectl
  script:
    - kubectl kustomize infra/k8s >/dev/null
    - kubectl apply --dry-run=client --validate=false -f infra/k8s/argocd-apps.yaml >/dev/null

test:backend:
  stage: test
  image: docker.io/library/maven@sha256:8df9a1dbc464977482f726f28a8a1985dcef4e4e68bdda1ae0330711bcb3a192
  cache:
    key: devapp-maven-v1
    paths:
      - .cache/maven/
    policy: pull-push
  script:
    - mvn --batch-mode clean verify -Dhttp.proxyHost= -Dhttps.proxyHost=
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      junit:
        - '**/target/surefire-reports/*.xml'
    paths:
      - user-app/target/user-app.jar
      - order-app/target/order-app.jar

test:web:
  stage: test
  image: docker.io/library/node@sha256:2a49bdf71e9fd965a58c1703fd9ddd205b34e5782b692a72dd1d248abb0beb43
  cache:
    key: devapp-npm-v1
    paths:
      - .cache/npm/
    policy: pull-push
  before_script:
    - cd devapp-web
    - npm install --global npm@12.0.2
    - npm ci
  script:
    - npm run test:ci
    - npm run test:e2e:types
    - npm run build-prod
  artifacts:
    when: always
    expire_in: 1 day
    reports:
      junit: devapp-web/test-results.xml
    paths:
      - devapp-web/dist/
      - devapp-web/test-results.xml

.publish-image:
  stage: publish
  image:
    name: gcr.io/kaniko-project/executor@sha256:c3109d5926a997b100c4343944e06c6b30a6804b2f9abe0994d3de6ef92b028e
    entrypoint: [""]
  before_script:
    - mkdir -p /kaniko/.docker
    - auth="$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
    - printf '{"auths":{"%s":{"auth":"%s"}}}\n' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
  script:
    - >-
      /kaniko/executor
      --context "$BUILD_CONTEXT"
      --dockerfile "$DOCKERFILE"
      --destination "$CI_REGISTRY_IMAGE/$IMAGE_NAME:$APP_VERSION"
      --snapshot-mode=redo
      --use-new-run
      --cleanup
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

publish:user-app:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR"
    DOCKERFILE: "$CI_PROJECT_DIR/user-app/Dockerfile.runtime"
    IMAGE_NAME: user-app
  dependencies:
    - test:backend

publish:order-app:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR"
    DOCKERFILE: "$CI_PROJECT_DIR/order-app/Dockerfile.runtime"
    IMAGE_NAME: order-app
  dependencies:
    - test:backend

publish:web:
  extends: .publish-image
  variables:
    BUILD_CONTEXT: "$CI_PROJECT_DIR/devapp-web"
    DOCKERFILE: "$CI_PROJECT_DIR/devapp-web/Dockerfile.runtime"
    IMAGE_NAME: devapp-web
  dependencies:
    - test:web

deploy:gitops:
  stage: deploy
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  resource_group: devapp-production
  before_script:
    - apk add --no-cache bash git kubectl
  script:
    - git fetch origin "$CI_DEFAULT_BRANCH"
    - test "$CI_COMMIT_SHA" = "$(git rev-parse "origin/$CI_DEFAULT_BRANCH")"
    - git checkout -B "$CI_DEFAULT_BRANCH" "origin/$CI_DEFAULT_BRANCH"
    - infra/scripts/set-image-tags.sh "$APP_VERSION"
    - git config user.name "DevApp GitLab CI"
    - git config user.email "gitlab-ci@swirlit.dev"
    - git add infra/k8s/kustomization.yaml
    - 'git commit -m "deploy: $APP_VERSION [skip ci]"'
    - git push origin "HEAD:$CI_DEFAULT_BRANCH"
    - DEPLOY_REVISION="$(git rev-parse HEAD)"
    - printf 'DEPLOY_REVISION=%s\n' "$DEPLOY_REVISION" > deploy.env
    - kubectl apply -f infra/k8s/argocd-apps.yaml
    - kubectl annotate application devapp -n infra argocd.argoproj.io/refresh=hard --overwrite
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

verify:rollout:
  stage: verify
  image: docker.io/library/alpine@sha256:eafc1edb577d2e9b458664a15f23ea1c370214193226069eb22921169fc7e43f
  before_script:
    - apk add --no-cache curl jq kubectl
  script:
    - |
      set -eu
      deadline=$(( $(date +%s) + 900 ))
      while [ "$(date +%s)" -lt "$deadline" ]; do
        application="$(kubectl get application devapp -n infra -o json 2>/dev/null || true)"
        revision="$(printf '%s' "$application" | jq -r '.status.sync.revision // empty')"
        sync="$(printf '%s' "$application" | jq -r '.status.sync.status // empty')"
        health="$(printf '%s' "$application" | jq -r '.status.health.status // empty')"
        printf 'Argo CD: revision=%s sync=%s health=%s\n' "${revision:-unknown}" "${sync:-unknown}" "${health:-unknown}"
        if [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]; then
          break
        fi
        sleep 10
      done
      [ "$revision" = "$DEPLOY_REVISION" ] && [ "$sync" = "Synced" ] && [ "$health" = "Healthy" ]
    - curl --fail --silent --show-error http://user-app.apps.svc.cluster.local:8080/actuator/health >/dev/null
    - curl --fail --silent --show-error http://order-app.apps.svc.cluster.local:8081/actuator/health >/dev/null
    - curl --fail --silent --show-error http://devapp-web.apps.svc.cluster.local/ >/dev/null
  needs:
    - job: deploy:gitops
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

acceptance:browser:
  stage: acceptance
  image:
    name: mcr.microsoft.com/playwright@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    entrypoint: [""]
  before_script:
    - cd devapp-web
    - npm ci
  script:
    - |
      ingress_ip="$(getent ahostsv4 ingress-nginx-controller.swirlit.internal | awk 'NR == 1 {print $1}')"
      test -n "$ingress_ip"
      printf '%s\t%s %s\n' "$ingress_ip" devapp.swirlit.dev keycloak.swirlit.dev >> /etc/hosts
    - WEB_URL=https://devapp.swirlit.dev OIDC_USERNAME=user OIDC_PASSWORD=password IGNORE_HTTPS_ERRORS=true CI=true npm run test:integration
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: devapp-web/test-results/playwright-junit.xml
    paths:
      - devapp-web/test-results/
      - devapp-web/playwright-report/
  needs:
    - verify:rollout
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
