apiVersion: v1
kind: ConfigMap
metadata:
  name: devapp-jenkins-job
  namespace: infra
data:
  configure.groovy: |
    import hudson.plugins.git.BranchSpec
    import hudson.plugins.git.GitSCM
    import hudson.plugins.git.UserRemoteConfig
    import jenkins.model.Jenkins
    import org.csanchez.jenkins.plugins.kubernetes.KubernetesCloud
    import org.jenkinsci.plugins.workflow.cps.CpsScmFlowDefinition
    import org.jenkinsci.plugins.workflow.job.WorkflowJob

    def jenkins = Jenkins.get()
    def cloud = jenkins.getCloud('kubernetes')
    if (cloud != null && !(cloud instanceof KubernetesCloud)) {
      jenkins.clouds.remove(cloud)
      cloud = null
    }
    if (cloud == null) {
      cloud = new KubernetesCloud('kubernetes')
      jenkins.clouds.add(cloud)
    }
    cloud.setServerUrl('https://kubernetes.default.svc.cluster.local')
    cloud.setNamespace('jenkins-builds')
    cloud.setJenkinsUrl('http://jenkins.swirlit.internal:8080')
    cloud.setJenkinsTunnel('jenkins.swirlit.internal:50000')
    cloud.setContainerCapStr('4')
    cloud.setSkipTlsVerify(false)
    cloud.setWebSocket(false)

    def job = jenkins.getItem('devapp')
    if (job != null && !(job instanceof WorkflowJob)) {
      throw new IllegalStateException("A non-Pipeline item named 'devapp' already exists")
    }
    if (job == null) {
      job = jenkins.createProject(WorkflowJob, 'devapp')
    }
    def scm = new GitSCM(
      [new UserRemoteConfig('http://gitlab.swirlit.internal/root/devapp.git', null, null, null)],
      [new BranchSpec('*/main')],
      false,
      [],
      null,
      null,
      []
    )
    def definition = new CpsScmFlowDefinition(scm, 'Jenkinsfile')
    definition.setLightweight(true)
    job.setDefinition(definition)
    job.setDescription('DevApp CI; Jenkins builds and pushes immutable images to Nexus, while Argo CD owns rollout.')
    job.save()
    jenkins.save()
    println('DEVAPP_JENKINS_CONFIGURED')
---
apiVersion: batch/v1
kind: Job
metadata:
  name: devapp-jenkins-configure
  namespace: infra
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: devapp-jenkins-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          image: curlimages/curl:8.12.1
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              password=$(cat /var/jenkins_home/secrets/initialAdminPassword)
              url=http://jenkins.swirlit.internal:8080
              until curl -fsS -u "admin:$password" "$url/api/json" >/dev/null; do
                sleep 5
              done
              cookies=$(mktemp)
              crumb=$(curl -fsS -u "admin:$password" \
                -c "$cookies" \
                "$url/crumbIssuer/api/xml?xpath=concat(//crumbRequestField,%22:%22,//crumb)")
              response=$(mktemp)
              trap 'rm -f "$cookies" "$response"' EXIT
              curl -fsS -u "admin:$password" -b "$cookies" -H "$crumb" \
                --data-urlencode script@/config/configure.groovy \
                "$url/scriptText" > "$response"
              cat "$response"
              grep -q DEVAPP_JENKINS_CONFIGURED "$response"
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: jenkins-home
              mountPath: /var/jenkins_home
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: devapp-jenkins-job
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-home
