apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: devapp
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-ingress
  namespace: devapp
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - devapp-web
          - user-app
          - order-app
  policyTypes:
    - Ingress
  ingress:
    # Keep internal application communication available.
    - from:
        - podSelector: {}
    # Public requests arrive only through the cluster ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Prometheus in infra scrapes the annotated actuator endpoints.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # The ephemeral Jenkins agent performs post-rollout smoke checks.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: jenkins-builds
          podSelector:
            matchLabels:
              app: devapp-build
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
