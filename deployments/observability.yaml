apiVersion: v1
kind: ConfigMap
metadata:
  name: devapp-grafana-dashboard
  namespace: devapp
  labels:
    grafana_dashboard: "1"
data:
  devapp-overview.json: |
    {
      "uid": "devapp-overview",
      "title": "DevApp Overview",
      "tags": ["devapp", "spring-boot", "provisioned"],
      "timezone": "browser",
      "schemaVersion": 41,
      "version": 1,
      "refresh": "30s",
      "time": {"from": "now-6h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "application",
            "label": "Application",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "prometheus"},
            "query": {"query": "label_values(up{job=\"kubernetes-pods\",namespace=\"devapp\"}, app)", "refId": "PrometheusVariableQueryEditor-VariableQuery"},
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "refresh": 1,
            "current": {"text": "All", "value": ["$__all"]}
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Application Targets Up",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(up{job=\"kubernetes-pods\",namespace=\"devapp\",app=~\"$application\"})", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "short", "thresholds": {"mode": "absolute", "steps": [{"color": "red"}, {"color": "green", "value": 1}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "none"}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Request Rate",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"devapp\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "5xx Error Rate",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"devapp\",app=~\"$application\",status=~\"5..\"}[5m]))", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "reqps", "thresholds": {"mode": "absolute", "steps": [{"color": "green"}, {"color": "red", "value": 0.01}]}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Average Response Time",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum(rate(http_server_requests_seconds_sum{namespace=\"devapp\",app=~\"$application\",uri!~\"/actuator.*\"}[5m])) / clamp_min(sum(rate(http_server_requests_seconds_count{namespace=\"devapp\",app=~\"$application\",uri!~\"/actuator.*\"}[5m])), 0.000001)", "instant": true}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"], "values": false}, "colorMode": "value", "graphMode": "area"}
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "HTTP Requests by Application and Status",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app, status) (rate(http_server_requests_seconds_count{namespace=\"devapp\",app=~\"$application\",uri!~\"/actuator.*\"}[5m]))", "legendFormat": "{{app}} HTTP {{status}}"}],
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "JVM Heap Used",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app) (jvm_memory_used_bytes{namespace=\"devapp\",app=~\"$application\",area=\"heap\"})", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Application CPU",
          "gridPos": {"x": 0, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (app) (process_cpu_usage{namespace=\"devapp\",app=~\"$application\"}) * 100", "legendFormat": "{{app}}"}],
          "fieldConfig": {"defaults": {"unit": "percent", "min": 0, "max": 100}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Database Connections",
          "gridPos": {"x": 8, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [
            {"refId": "A", "expr": "sum by (app) (hikaricp_connections_active{namespace=\"devapp\",app=~\"$application\"})", "legendFormat": "{{app}} active"},
            {"refId": "B", "expr": "sum by (app) (hikaricp_connections_pending{namespace=\"devapp\",app=~\"$application\"})", "legendFormat": "{{app}} pending"}
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Pod Memory",
          "gridPos": {"x": 16, "y": 12, "w": 8, "h": 8},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"devapp\",container=~\"user-app|order-app|devapp-web\"})", "legendFormat": "{{pod}}"}],
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "options": {"legend": {"displayMode": "table", "placement": "bottom"}}
        },
        {
          "id": 10,
          "type": "table",
          "title": "DevApp Pod Restarts",
          "gridPos": {"x": 0, "y": 20, "w": 24, "h": 7},
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "targets": [{"refId": "A", "expr": "kube_pod_container_status_restarts_total{namespace=\"devapp\"}", "legendFormat": "{{pod}} / {{container}}", "instant": true, "format": "table"}],
          "options": {"showHeader": true}
        }
      ]
    }

