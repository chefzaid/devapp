---
apiVersion: batch/v1
kind: Job
metadata:
  name: devapp-kibana-bootstrap-v3
  namespace: devapp
  labels:
    app: devapp-kibana-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app: devapp-kibana-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-saved-objects
          image: curlimages/curl:8.14.1
          command:
            - sh
            - -c
            - |
              until curl -fsS http://kibana.infra.svc.cluster.local:5601/api/status >/dev/null; do sleep 5; done
              response="$(curl -fsS -X POST \
                -H 'kbn-xsrf: devapp-observability-bootstrap' \
                -F file=@/saved-objects/devapp.ndjson \
                'http://kibana.infra.svc.cluster.local:5601/api/saved_objects/_import?overwrite=true')"
              echo "$response"
              echo "$response" | grep -q '"success":true'
          volumeMounts:
            - name: saved-objects
              mountPath: /saved-objects
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: saved-objects
          configMap:
            name: devapp-kibana-saved-objects
