map $uri $devapp_cache_control {
    default "no-cache";
    /runtime-config.json "no-store";
    ~*\.(?:css|js|ico|png|svg|woff2?)$ "public, max-age=31536000, immutable";
}

server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    add_header Cache-Control $devapp_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # A missing configuration must not receive the Angular index page.
    location = /runtime-config.json {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|ico|png|svg|woff2?)$ {
        try_files $uri =404;
    }

    # Optional local-development routes; production needs only static files.
    include /etc/nginx/devapp/*.conf;
}
