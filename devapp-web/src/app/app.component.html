<div class="app-container">
  <header class="app-header">
    <h1 class="app-title">DevApp</h1>
    @if (isLoggedIn$ | async) {
      <nav class="app-nav">
        <a routerLink="/users" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">👥</span>
          Users
        </a>
        <a routerLink="/orders" routerLinkActive="active" class="nav-link">
          <span class="nav-icon">📦</span>
          Orders
        </a>
        <button (click)="logout()" class="nav-link nav-button" type="button">
          <span class="nav-icon">🚪</span>
          Logout
        </button>
      </nav>
    }
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>Java 25 · Spring Boot 4 · Angular 22 · Kubernetes platform demo</p>
  </footer>

  <app-notification></app-notification>
</div>
