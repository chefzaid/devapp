include:
  - path: compose.yaml

services:
  test-runner:
    image: cypress/included:15.20.1
    working_dir: /workspace
    volumes:
      - ./devapp-web:/workspace
      - test-node-modules:/workspace/node_modules
    environment:
      WEB_URL: http://web:8080
      CYPRESS_INSTALL_BINARY: "0"
    command: ["sh", "-c", "npm ci && npm run test:integration"]
    depends_on:
      web:
        condition: service_healthy

volumes:
  test-node-modules:
