---
- name: Deploy DevApp Application to Kubernetes
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    app_namespace: apps
    kustomize_dir: "{{ playbook_dir }}/../k8s"

  tasks:
    - name: Ensure app namespace exists
      command: kubectl create namespace {{ app_namespace }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Remove the previous Kibana saved-object bootstrap job
      command: kubectl delete job devapp-kibana-bootstrap-v6 -n {{ app_namespace }} --ignore-not-found
      changed_when: false

    - name: Deploy the complete Kustomize application
      command: kubectl apply -k {{ kustomize_dir }}
      register: result
      changed_when: "'created' in result.stdout or 'configured' in result.stdout"

    - name: Wait for applications
      command: kubectl wait --for=condition=ready pod -l app={{ item }} -n {{ app_namespace }} --timeout=180s
      loop: [user-app, order-app, devapp-web]
      ignore_errors: yes

    - name: Wait for devapp database ExternalSecret
      command: kubectl wait --for=condition=Ready externalsecret/devapp-db-credentials -n {{ app_namespace }} --timeout=180s
      ignore_errors: yes

    - name: Wait for Kibana saved-object bootstrap
      command: kubectl wait --for=condition=complete job/devapp-kibana-bootstrap-v6 -n {{ app_namespace }} --timeout=180s
      ignore_errors: yes

    - name: Display status
      command: kubectl get pods -n {{ app_namespace }} --no-headers
      register: pods
    - debug:
        msg: "{{ pods.stdout_lines }}"
