# Only the local Compose stack routes APIs and Keycloak through the web container.
# Kubernetes ingress sends API traffic directly to the owning service.
location ^~ /api/users {
    proxy_pass http://user-app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/orders {
    proxy_pass http://order-app:8081;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/docs {
    proxy_pass http://user-app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/swagger-ui {
    proxy_pass http://user-app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /swagger-ui {
    proxy_pass http://user-app:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /auth/ {
    proxy_pass http://keycloak:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
