# App-owned creation only: existing databases, owners and data remain intact.
apiVersion: batch/v1
kind: Job
metadata:
  name: devapp-db-setup
  namespace: apps
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: db-setup
          image: postgres:18.6-bookworm
          command:
            - sh
            - -ec
            - |
              export PGUSER="$DB_USERNAME" PGPASSWORD="$DB_PASSWORD"
              psql -X --no-password --set=ON_ERROR_STOP=1 <<'SQL'
              SELECT pg_advisory_lock(hashtext('devapp.database-bootstrap'));
              SELECT format('CREATE DATABASE devappdb OWNER %I', current_user)
              WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'devappdb')
              \gexec
              SELECT pg_advisory_unlock(hashtext('devapp.database-bootstrap'));
              SQL
          env:
            - name: PGHOST
              value: postgres.swirlit.internal
            - name: PGDATABASE
              value: postgres
            - name: PGCONNECT_TIMEOUT
              value: "10"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: devapp-db-credentials
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devapp-db-credentials
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
