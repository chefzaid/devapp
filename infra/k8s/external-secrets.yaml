apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: swirl-demo-app-runtime-credentials
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: swirl-demo-app-runtime-credentials
    creationPolicy: Owner
  data:
    - secretKey: DB_USERNAME
      remoteRef:
        key: apps/swirl-demo-app/prod/database
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: apps/swirl-demo-app/prod/database
        property: password
    - secretKey: REDIS_USERNAME
      remoteRef:
        key: apps/swirl-demo-app/prod/redis
        property: username
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: apps/swirl-demo-app/prod/redis
        property: password
    - secretKey: KAFKA_USERNAME
      remoteRef:
        key: apps/swirl-demo-app/prod/kafka
        property: username
    - secretKey: KAFKA_PASSWORD
      remoteRef:
        key: apps/swirl-demo-app/prod/kafka
        property: password
