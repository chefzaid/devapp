apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: swirl-demo-app-ingress
  namespace: apps
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    gethomepage.dev/description: Full Java/Angular microservices app template
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: Applications
    gethomepage.dev/href: https://demo.swirlit.dev
    gethomepage.dev/icon: mdi-application-braces-outline
    gethomepage.dev/name: Swirl Demo App
    gethomepage.dev/weight: "20"
    gethomepage.dev/pod-selector: app=swirlapp-web
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: apps-swirl-demo-app-upload-limit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - demo.swirlit.dev
    secretName: swirlit-dev-tls
  rules:
  - host: demo.swirlit.dev
    http:
      paths:
      # User API
      - path: /api/users
        pathType: Prefix
        backend:
          service:
            name: swirlapp-user
            port:
              number: 8080
      # Order API
      - path: /api/orders
        pathType: Prefix
        backend:
          service:
            name: swirlapp-order
            port:
              number: 8081
      # Aggregated OpenAPI UI and its static assets
      - path: /api/docs
        pathType: Prefix
        backend:
          service:
            name: swirlapp-user
            port:
              number: 8080
      - path: /swagger-ui
        pathType: Prefix
        backend:
          service:
            name: swirlapp-user
            port:
              number: 8080
      - path: /api/swagger-ui
        pathType: Prefix
        backend:
          service:
            name: swirlapp-user
            port:
              number: 8080
      # Frontend (catch-all)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: swirlapp-web
            port:
              number: 80
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: swirl-demo-app-upload-limit
  namespace: apps
spec:
  buffering:
    maxRequestBodyBytes: 10485760
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: swirl-demo-app-backend
  namespace: apps
spec:
  forwardingTimeouts:
    responseHeaderTimeout: 60s
