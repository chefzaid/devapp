apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-application-ingress
  namespace: apps
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - devapp-web
          - user-app
          - order-app
  policyTypes:
    - Ingress
  ingress:
    # Keep internal application communication available.
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - devapp-web
                  - user-app
                  - order-app
    # Public requests arrive only through the cluster ingress controller.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
    # Prometheus in infra scrapes the annotated actuator endpoints.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: infra
          podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8081
