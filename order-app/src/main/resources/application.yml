server:
  port: 8081
  shutdown: graceful
  compression:
    enabled: true

spring:
  application:
    name: order-app
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:h2:mem:orderdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
      data-locations: classpath:db/data.sql
  h2:
    console:
      enabled: true
  cache:
    type: simple
    cache-names: orders
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:order-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.trusted.packages: dev.swirlit.devapp.common.event
        spring.json.value.default.type: dev.swirlit.devapp.common.event.OrderEvent
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
    listener:
      auto-startup: ${KAFKA_ENABLED:false}

app:
  security:
    enabled: false
  messaging:
    enabled: ${KAFKA_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    redis:
      enabled: false
  info:
    env:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Event-driven order service
    version: 1.0.0
    java: ${java.version}

springdoc:
  api-docs:
    path: /api/orders/openapi
  swagger-ui:
    enabled: false

logging:
  level:
    dev.swirlit.devapp: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: uat | prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres.swirlit.internal}:${DB_PORT:5432}/${DB_NAME:devappdb}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:redis.swirlit.internal}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://devapp.swirlit.dev/auth/realms/devapp}
          jwk-set-uri: ${JWT_JWK_SET_URI:https://devapp.swirlit.dev/auth/realms/devapp/protocol/openid-connect/certs}

app:
  security:
    enabled: true
  messaging:
    enabled: true

management:
  health:
    redis:
      enabled: true
